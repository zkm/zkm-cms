name: Deploy

# Push a v* tag on main to release and deploy it:  git tag v1.2.0 && git push origin v1.2.0
# Roll back: Actions -> Deploy -> Run workflow, and pick an earlier tag under "Use workflow from".
# That redeploys the tarball saved on the tag's GitHub Release, without rebuilding.
# docs/DEPLOY.md has the server and GitHub setup.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    if: github.event_name == 'push'
    uses: ./.github/workflows/tests.yml

  build:
    name: Build release
    if: github.event_name == 'push'
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: The tag is a version on main
        run: |
          if ! [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::$TAG is not vX.Y.Z"; exit 1; fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then echo "::error::$TAG is not on main"; exit 1; fi

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mysqli, gd, mbstring
          coverage: none

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json

      - name: Build
        run: |
          scripts/build-release.sh "zkm-cms-$TAG.tar.gz"
          sha256sum "zkm-cms-$TAG.tar.gz" > "zkm-cms-$TAG.tar.gz.sha256"

      # A pre-release until the deploy succeeds. Rerunning replaces the files.
      - name: Save on the GitHub Release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "zkm-cms-$TAG.tar.gz" "zkm-cms-$TAG.tar.gz.sha256" --clobber
          else
            gh release create "$TAG" "zkm-cms-$TAG.tar.gz" "zkm-cms-$TAG.tar.gz.sha256" \
              --verify-tag --prerelease --generate-notes --title "$TAG"
          fi

  deploy:
    name: Deploy to production
    needs: build
    # Runs after a build, or on its own for a rollback (build is skipped then).
    if: ${{ !cancelled() && (needs.build.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.build.result == 'skipped')) }}
    runs-on: ubuntu-latest
    # Secrets live on this environment, which only v* tags may use and which waits for approval.
    environment:
      name: production
      url: https://www.zachschneider.com/
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Only tags deploy
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then echo "::error::Pick a tag under 'Use workflow from', not a branch"; exit 1; fi

      - name: Fetch the release tarball
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "zkm-cms-$TAG.tar.gz*"
          sha256sum -c "zkm-cms-$TAG.tar.gz.sha256"

      # The key can only run the server's zkm-deploy script, which reads the tarball from stdin.
      # It fails unless the home page answers 200 through the server's own Apache. (Not checked
      # from here: Cloudflare's bot protection answers 403 to a runner's curl.)
      - name: Deploy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "deploy@$DEPLOY_HOST" < "zkm-cms-$TAG.tar.gz"

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Mark the release as deployed
        if: github.event_name == 'push'
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
